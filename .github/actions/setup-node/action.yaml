name: "Setup Node.js & Install Dependencies"
description: >
  Composite action that checks out the repository, sets up Node.js with npm
  cache, and runs `npm ci`. Referenced by every Node-dependent CI job so the
  three steps are defined exactly once.

inputs:
  node-version:
    description: "Node.js version to install"
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci
