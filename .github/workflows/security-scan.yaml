name: Security Scan

on:
  push:
  pull_request:
  schedule:
    # Full scan every Monday at 08:00 UTC
    - cron: '0 8 * * 1'

permissions:
  contents: read
  security-events: write   # required to upload SARIF to GitHub Security tab

jobs:
  # ─── 1. Dependency audit (npm audit) ────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit (npm audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js & install deps
        uses: ./.github/actions/setup-node

      - name: Run npm audit
        # Fail on CRITICAL vulnerabilities only
        run: npm audit --audit-level=critical

  # ─── 2. Filesystem & repo scan (Trivy) ──────────────────────────────────────
  trivy-fs:
    name: Filesystem Scan (Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Trivy on repository filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '0'           # fail the job on findings
          ignore-unfixed: true     # skip CVEs with no available fix
          format: sarif
          output: trivy-fs.sarif

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()               # upload even if the scan found issues
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem